<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Use Case Diagram - Lisingo C2C Platform</title>
    <style>
        body { background: #f8f9fa; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #2563eb; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        svg { display: block; margin: 0 auto; background: white; border: 1px solid #ddd; border-radius: 8px; }
    </style>
</head>
<body>
<h1>Use Case Diagram</h1>
<p class="subtitle">Lisingo C2C E-Commerce Platform</p>

<svg width="1000" height="950" viewBox="0 0 1000 950">
    <!-- System Boundary -->
    <rect x="200" y="30" width="580" height="890" rx="10" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="8"/>
    <text x="490" y="60" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563eb">Lisingo C2C E-Commerce Platform</text>

    <!-- ACTORS -->
    <!-- Guest -->
    <circle cx="80" cy="130" r="15" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="80" y1="145" x2="80" y2="190" stroke="#333" stroke-width="2"/>
    <line x1="55" y1="165" x2="105" y2="165" stroke="#333" stroke-width="2"/>
    <line x1="80" y1="190" x2="60" y2="220" stroke="#333" stroke-width="2"/>
    <line x1="80" y1="190" x2="100" y2="220" stroke="#333" stroke-width="2"/>
    <text x="80" y="240" text-anchor="middle" font-size="12" font-weight="bold">Guest</text>

    <!-- Buyer -->
    <circle cx="80" cy="380" r="15" fill="none" stroke="#16a34a" stroke-width="2"/>
    <line x1="80" y1="395" x2="80" y2="440" stroke="#16a34a" stroke-width="2"/>
    <line x1="55" y1="415" x2="105" y2="415" stroke="#16a34a" stroke-width="2"/>
    <line x1="80" y1="440" x2="60" y2="470" stroke="#16a34a" stroke-width="2"/>
    <line x1="80" y1="440" x2="100" y2="470" stroke="#16a34a" stroke-width="2"/>
    <text x="80" y="490" text-anchor="middle" font-size="12" font-weight="bold" fill="#16a34a">Buyer</text>

    <!-- Seller -->
    <circle cx="80" cy="650" r="15" fill="none" stroke="#ca8a04" stroke-width="2"/>
    <line x1="80" y1="665" x2="80" y2="710" stroke="#ca8a04" stroke-width="2"/>
    <line x1="55" y1="685" x2="105" y2="685" stroke="#ca8a04" stroke-width="2"/>
    <line x1="80" y1="710" x2="60" y2="740" stroke="#ca8a04" stroke-width="2"/>
    <line x1="80" y1="710" x2="100" y2="740" stroke="#ca8a04" stroke-width="2"/>
    <text x="80" y="760" text-anchor="middle" font-size="12" font-weight="bold" fill="#ca8a04">Seller</text>

    <!-- Admin -->
    <circle cx="920" cy="300" r="15" fill="none" stroke="#db2777" stroke-width="2"/>
    <line x1="920" y1="315" x2="920" y2="360" stroke="#db2777" stroke-width="2"/>
    <line x1="895" y1="335" x2="945" y2="335" stroke="#db2777" stroke-width="2"/>
    <line x1="920" y1="360" x2="900" y2="390" stroke="#db2777" stroke-width="2"/>
    <line x1="920" y1="360" x2="940" y2="390" stroke="#db2777" stroke-width="2"/>
    <text x="920" y="410" text-anchor="middle" font-size="12" font-weight="bold" fill="#db2777">Admin</text>

    <!-- Super Admin -->
    <circle cx="920" cy="650" r="15" fill="none" stroke="#7c3aed" stroke-width="2"/>
    <line x1="920" y1="665" x2="920" y2="710" stroke="#7c3aed" stroke-width="2"/>
    <line x1="895" y1="685" x2="945" y2="685" stroke="#7c3aed" stroke-width="2"/>
    <line x1="920" y1="710" x2="900" y2="740" stroke="#7c3aed" stroke-width="2"/>
    <line x1="920" y1="710" x2="940" y2="740" stroke="#7c3aed" stroke-width="2"/>
    <text x="920" y="760" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c3aed">Super Admin</text>

    <!-- Inheritance: Admin -> Super Admin -->
    <line x1="920" y1="410" x2="920" y2="635" stroke="#333" stroke-width="1.5"/>
    <polygon points="910,635 920,645 930,635" fill="white" stroke="#333" stroke-width="1.5"/>

    <!-- USE CASES -->
    <!-- Guest Use Cases -->
    <ellipse cx="350" cy="100" rx="100" ry="22" fill="#f0f9ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="350" y="105" text-anchor="middle" font-size="11">Browse Products</text>

    <ellipse cx="350" cy="160" rx="100" ry="22" fill="#f0f9ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="350" y="165" text-anchor="middle" font-size="11">Search Products</text>

    <ellipse cx="350" cy="220" rx="100" ry="22" fill="#f0f9ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="350" y="225" text-anchor="middle" font-size="11">Register Account</text>

    <ellipse cx="550" cy="100" rx="100" ry="22" fill="#f0f9ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="550" y="105" text-anchor="middle" font-size="11">View Product Details</text>

    <ellipse cx="550" cy="160" rx="100" ry="22" fill="#f0f9ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="550" y="165" text-anchor="middle" font-size="11">Login</text>

    <!-- Buyer Use Cases -->
    <ellipse cx="350" cy="330" rx="100" ry="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="350" y="335" text-anchor="middle" font-size="11">Add to Cart</text>

    <ellipse cx="350" cy="390" rx="100" ry="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="350" y="395" text-anchor="middle" font-size="11">Place Order (Checkout)</text>

    <ellipse cx="350" cy="450" rx="100" ry="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="350" y="455" text-anchor="middle" font-size="11">View Order History</text>

    <ellipse cx="550" cy="330" rx="100" ry="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="550" y="335" text-anchor="middle" font-size="11">Send Message</text>

    <ellipse cx="550" cy="390" rx="100" ry="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="550" y="395" text-anchor="middle" font-size="11">Leave Review</text>

    <ellipse cx="550" cy="450" rx="100" ry="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="550" y="455" text-anchor="middle" font-size="11">Edit Profile</text>

    <!-- Seller Use Cases -->
    <ellipse cx="350" cy="570" rx="100" ry="22" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="350" y="575" text-anchor="middle" font-size="11">Create Product Listing</text>

    <ellipse cx="350" cy="630" rx="100" ry="22" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="350" y="635" text-anchor="middle" font-size="11">Edit Product Listing</text>

    <ellipse cx="350" cy="690" rx="100" ry="22" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="350" y="695" text-anchor="middle" font-size="11">Manage My Products</text>

    <ellipse cx="550" cy="570" rx="100" ry="22" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="550" y="575" text-anchor="middle" font-size="11">Update Order Status</text>

    <ellipse cx="550" cy="630" rx="100" ry="22" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="550" y="635" text-anchor="middle" font-size="11">Reply to Messages</text>

    <ellipse cx="550" cy="690" rx="100" ry="22" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="550" y="695" text-anchor="middle" font-size="11">Upload Product Images</text>

    <!-- Admin Use Cases -->
    <ellipse cx="620" cy="780" rx="110" ry="22" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
    <text x="620" y="785" text-anchor="middle" font-size="11">Manage Users (CRUD)</text>

    <ellipse cx="400" cy="780" rx="110" ry="22" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
    <text x="400" y="785" text-anchor="middle" font-size="11">Moderate Products</text>

    <ellipse cx="400" cy="840" rx="110" ry="22" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
    <text x="400" y="845" text-anchor="middle" font-size="11">Manage Categories</text>

    <ellipse cx="620" cy="840" rx="110" ry="22" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
    <text x="620" y="845" text-anchor="middle" font-size="11">View Reports</text>

    <ellipse cx="510" cy="900" rx="110" ry="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="510" y="905" text-anchor="middle" font-size="11">Manage Roles (RBAC)</text>

    <!-- CONNECTIONS -->
    <!-- Guest connections -->
    <line x1="105" y1="130" x2="250" y2="100" stroke="#333" stroke-width="1"/>
    <line x1="105" y1="130" x2="250" y2="160" stroke="#333" stroke-width="1"/>
    <line x1="105" y1="130" x2="250" y2="220" stroke="#333" stroke-width="1"/>
    <line x1="105" y1="130" x2="450" y2="100" stroke="#333" stroke-width="1"/>
    <line x1="105" y1="130" x2="450" y2="160" stroke="#333" stroke-width="1"/>

    <!-- Buyer connections -->
    <line x1="105" y1="380" x2="250" y2="330" stroke="#16a34a" stroke-width="1"/>
    <line x1="105" y1="410" x2="250" y2="390" stroke="#16a34a" stroke-width="1"/>
    <line x1="105" y1="420" x2="250" y2="450" stroke="#16a34a" stroke-width="1"/>
    <line x1="105" y1="380" x2="450" y2="330" stroke="#16a34a" stroke-width="1"/>
    <line x1="105" y1="410" x2="450" y2="390" stroke="#16a34a" stroke-width="1"/>
    <line x1="105" y1="420" x2="450" y2="450" stroke="#16a34a" stroke-width="1"/>

    <!-- Seller connections -->
    <line x1="105" y1="650" x2="250" y2="570" stroke="#ca8a04" stroke-width="1"/>
    <line x1="105" y1="660" x2="250" y2="630" stroke="#ca8a04" stroke-width="1"/>
    <line x1="105" y1="680" x2="250" y2="690" stroke="#ca8a04" stroke-width="1"/>
    <line x1="105" y1="650" x2="450" y2="570" stroke="#ca8a04" stroke-width="1"/>
    <line x1="105" y1="660" x2="450" y2="630" stroke="#ca8a04" stroke-width="1"/>
    <line x1="105" y1="680" x2="450" y2="690" stroke="#ca8a04" stroke-width="1"/>

    <!-- Admin connections -->
    <line x1="895" y1="340" x2="730" y2="780" stroke="#db2777" stroke-width="1"/>
    <line x1="895" y1="340" x2="510" y2="780" stroke="#db2777" stroke-width="1"/>
    <line x1="895" y1="340" x2="510" y2="840" stroke="#db2777" stroke-width="1"/>
    <line x1="895" y1="340" x2="730" y2="840" stroke="#db2777" stroke-width="1"/>

    <!-- Super Admin connections -->
    <line x1="895" y1="680" x2="620" y2="900" stroke="#7c3aed" stroke-width="1"/>

    <!-- Include relationships -->
    <!-- Place Order includes Add to Cart -->
    <line x1="350" y1="368" x2="350" y2="352" stroke="#999" stroke-width="1" stroke-dasharray="4"/>
    <text x="360" y="363" font-size="9" fill="#999" font-style="italic">&lt;&lt;include&gt;&gt;</text>

    <!-- Create Listing includes Upload Images -->
    <line x1="450" y1="570" x2="450" y2="690" stroke="#999" stroke-width="1" stroke-dasharray="4"/>
    <text x="455" y="640" font-size="9" fill="#999" font-style="italic">&lt;&lt;include&gt;&gt;</text>
</svg>
</body>
</html>
