<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Flow Diagram - Lisingo C2C Platform</title>
    <style>
        body { background: #f8f9fa; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #2563eb; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        svg { display: block; margin: 0 auto; background: white; border: 1px solid #ddd; border-radius: 8px; }
    </style>
</head>
<body>
<h1>Data Flow Diagram (DFD) - Level 1</h1>
<p class="subtitle">Lisingo C2C E-Commerce Platform</p>

<svg width="1050" height="850" viewBox="0 0 1050 850">
    <defs>
        <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
        </marker>
    </defs>

    <!-- External Entities -->
    <rect x="30" y="30" width="140" height="50" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="100" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Buyer</text>

    <rect x="30" y="740" width="140" height="50" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="100" y="770" text-anchor="middle" font-size="13" font-weight="bold" fill="#854d0e">Seller</text>

    <rect x="870" y="30" width="150" height="50" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="945" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#9d174d">Administrator</text>

    <!-- Processes -->
    <!-- P1: User Registration & Authentication -->
    <circle cx="300" cy="100" r="50" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="300" y="93" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">1.0</text>
    <text x="300" y="108" text-anchor="middle" font-size="10" fill="#1e40af">Register &</text>
    <text x="300" y="120" text-anchor="middle" font-size="10" fill="#1e40af">Authenticate</text>

    <!-- P2: Product Management -->
    <circle cx="300" cy="350" r="50" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="300" y="343" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">2.0</text>
    <text x="300" y="358" text-anchor="middle" font-size="10" fill="#1e40af">Manage</text>
    <text x="300" y="370" text-anchor="middle" font-size="10" fill="#1e40af">Products</text>

    <!-- P3: Order Processing -->
    <circle cx="600" cy="250" r="50" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="600" y="243" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">3.0</text>
    <text x="600" y="258" text-anchor="middle" font-size="10" fill="#1e40af">Process</text>
    <text x="600" y="270" text-anchor="middle" font-size="10" fill="#1e40af">Orders</text>

    <!-- P4: Cart Management -->
    <circle cx="600" cy="100" r="50" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="600" y="93" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">4.0</text>
    <text x="600" y="108" text-anchor="middle" font-size="10" fill="#1e40af">Manage</text>
    <text x="600" y="120" text-anchor="middle" font-size="10" fill="#1e40af">Cart</text>

    <!-- P5: Messaging -->
    <circle cx="300" cy="580" r="50" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="300" y="573" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">5.0</text>
    <text x="300" y="588" text-anchor="middle" font-size="10" fill="#1e40af">Messaging</text>
    <text x="300" y="600" text-anchor="middle" font-size="10" fill="#1e40af">System</text>

    <!-- P6: Admin Management -->
    <circle cx="800" cy="250" r="50" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="800" y="243" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">6.0</text>
    <text x="800" y="258" text-anchor="middle" font-size="10" fill="#1e40af">Admin</text>
    <text x="800" y="270" text-anchor="middle" font-size="10" fill="#1e40af">Management</text>

    <!-- P7: Reviews -->
    <circle cx="600" cy="450" r="50" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="600" y="443" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">7.0</text>
    <text x="600" y="458" text-anchor="middle" font-size="10" fill="#1e40af">Reviews &</text>
    <text x="600" y="470" text-anchor="middle" font-size="10" fill="#1e40af">Ratings</text>

    <!-- Data Stores -->
    <!-- D1: Users -->
    <line x1="460" y1="170" x2="460" y2="200" stroke="#333" stroke-width="1.5"/>
    <rect x="460" y="170" width="110" height="30" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="515" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">D1 Users</text>

    <!-- D2: Products -->
    <line x1="420" y1="420" x2="420" y2="450" stroke="#333" stroke-width="1.5"/>
    <rect x="420" y="420" width="120" height="30" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="480" y="440" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">D2 Products</text>

    <!-- D3: Orders -->
    <line x1="720" y1="330" x2="720" y2="360" stroke="#333" stroke-width="1.5"/>
    <rect x="720" y="330" width="110" height="30" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="775" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">D3 Orders</text>

    <!-- D4: Cart -->
    <line x1="700" y1="80" x2="700" y2="110" stroke="#333" stroke-width="1.5"/>
    <rect x="700" y="80" width="100" height="30" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="750" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">D4 Cart</text>

    <!-- D5: Messages -->
    <line x1="130" y1="550" x2="130" y2="580" stroke="#333" stroke-width="1.5"/>
    <rect x="130" y="550" width="120" height="30" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="190" y="570" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">D5 Messages</text>

    <!-- D6: Reviews -->
    <line x1="700" y1="480" x2="700" y2="510" stroke="#333" stroke-width="1.5"/>
    <rect x="700" y="480" width="110" height="30" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="755" y="500" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">D6 Reviews</text>

    <!-- D7: Roles -->
    <line x1="870" y1="150" x2="870" y2="180" stroke="#333" stroke-width="1.5"/>
    <rect x="870" y="150" width="110" height="30" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="925" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">D7 Roles</text>

    <!-- D8: Categories -->
    <line x1="150" y1="310" x2="150" y2="340" stroke="#333" stroke-width="1.5"/>
    <rect x="150" y="310" width="120" height="30" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="210" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">D8 Categories</text>

    <!-- DATA FLOWS -->
    <!-- Buyer -> P1 (registration details) -->
    <line x1="170" y1="55" x2="250" y2="85" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="180" y="60" font-size="9" fill="#2563eb">Login/Register data</text>

    <!-- P1 -> D1 (store user) -->
    <line x1="350" y1="100" x2="460" y2="180" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="380" y="130" font-size="9" fill="#2563eb">User details</text>

    <!-- Buyer -> P4 (add to cart) -->
    <line x1="170" y1="55" x2="555" y2="80" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="350" y="50" font-size="9" fill="#2563eb">Add/Update items</text>

    <!-- P4 -> D4 (store cart) -->
    <line x1="650" y1="95" x2="700" y2="95" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="660" y="88" font-size="9" fill="#2563eb">Cart items</text>

    <!-- Seller -> P2 (list product) -->
    <line x1="100" y1="740" x2="280" y2="400" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="130" y="580" font-size="9" fill="#2563eb">Product details,</text>
    <text x="130" y="595" font-size="9" fill="#2563eb">images, pricing</text>

    <!-- P2 -> D2 (store product) -->
    <line x1="350" y1="370" x2="420" y2="430" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="360" y="410" font-size="9" fill="#2563eb">Product data</text>

    <!-- D8 -> P2 (categories) -->
    <line x1="210" y1="340" x2="260" y2="340" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="220" y="355" font-size="9" fill="#2563eb">Categories</text>

    <!-- P4 -> P3 (checkout) -->
    <line x1="600" y1="150" x2="600" y2="200" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="610" y="178" font-size="9" fill="#2563eb">Checkout</text>

    <!-- P3 -> D3 (store order) -->
    <line x1="650" y1="260" x2="720" y2="340" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="660" y="300" font-size="9" fill="#2563eb">Order data</text>

    <!-- P3 -> Seller (order notification) -->
    <line x1="560" y1="285" x2="120" y2="740" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="300" y="530" font-size="9" fill="#2563eb">Order notification</text>

    <!-- Buyer -> P5 / Seller -> P5 (messages) -->
    <line x1="100" y1="80" x2="270" y2="540" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="130" y="350" font-size="9" fill="#2563eb">Send message</text>

    <!-- P5 -> D5 -->
    <line x1="250" y1="575" x2="250" y2="570" stroke="#2563eb" stroke-width="1" marker-end="url(#arr)"/>

    <!-- Admin -> P6 -->
    <line x1="870" y1="80" x2="830" y2="210" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="860" y="140" font-size="9" fill="#2563eb">Manage users,</text>
    <text x="860" y="155" font-size="9" fill="#2563eb">roles, products</text>

    <!-- P6 -> D7 -->
    <line x1="830" y1="215" x2="880" y2="180" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="870" y="200" font-size="9" fill="#2563eb">Role data</text>

    <!-- D2 -> P7 -->
    <line x1="510" y1="450" x2="550" y2="450" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- P7 -> D6 -->
    <line x1="650" y1="460" x2="700" y2="490" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="660" y="465" font-size="9" fill="#2563eb">Review data</text>

    <!-- Legend -->
    <rect x="30" y="790" width="600" height="50" rx="6" fill="white" stroke="#ddd"/>
    <text x="50" y="812" font-size="11" font-weight="bold">Legend:</text>
    <rect x="110" y="800" width="40" height="20" fill="#dcfce7" stroke="#16a34a"/>
    <text x="160" y="815" font-size="10">External Entity</text>
    <circle cx="270" cy="810" r="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="290" y="815" font-size="10">Process</text>
    <rect x="360" y="802" width="60" height="16" fill="#f3e8ff" stroke="#7c3aed"/>
    <text x="430" y="815" font-size="10">Data Store</text>
    <line x1="500" y1="810" x2="540" y2="810" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="550" y="815" font-size="10">Data Flow</text>
</svg>
</body>
</html>
