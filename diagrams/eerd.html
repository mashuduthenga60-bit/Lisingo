<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EERD - Lisingo C2C Platform</title>
    <style>
        body { background: #f8f9fa; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #2563eb; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        svg { display: block; margin: 0 auto; background: white; border: 1px solid #ddd; border-radius: 8px; }
    </style>
</head>
<body>
<h1>Enhanced Entity Relationship Diagram (EERD)</h1>
<p class="subtitle">Lisingo C2C E-Commerce Platform</p>

<svg width="1100" height="900" viewBox="0 0 1100 900">
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
        </marker>
    </defs>

    <!-- ROLE Entity -->
    <rect x="30" y="80" width="180" height="200" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="30" y="80" width="180" height="32" rx="4" fill="#2563eb"/>
    <text x="120" y="102" text-anchor="middle" fill="white" font-weight="bold" font-size="14">ROLE</text>
    <text x="40" y="130" font-size="11" fill="#333"><tspan font-weight="bold" text-decoration="underline">PK id</tspan></text>
    <text x="40" y="148" font-size="11" fill="#333">role_name (UNIQUE)</text>
    <text x="40" y="166" font-size="11" fill="#333">description</text>
    <text x="40" y="184" font-size="11" fill="#333">can_manage_users</text>
    <text x="40" y="202" font-size="11" fill="#333">can_manage_products</text>
    <text x="40" y="220" font-size="11" fill="#333">can_manage_orders</text>
    <text x="40" y="238" font-size="11" fill="#333">can_manage_categories</text>
    <text x="40" y="256" font-size="11" fill="#333">can_manage_roles</text>
    <text x="40" y="274" font-size="11" fill="#333">can_view_reports</text>

    <!-- USER Entity (Supertype) -->
    <rect x="300" y="50" width="200" height="280" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="300" y="50" width="200" height="32" rx="4" fill="#16a34a"/>
    <text x="400" y="72" text-anchor="middle" fill="white" font-weight="bold" font-size="14">USER</text>
    <text x="310" y="100" font-size="11" fill="#333"><tspan font-weight="bold" text-decoration="underline">PK id</tspan></text>
    <text x="310" y="118" font-size="11" fill="#333">FK role_id</text>
    <text x="310" y="136" font-size="11" fill="#333">username (UNIQUE)</text>
    <text x="310" y="154" font-size="11" fill="#333">email (UNIQUE)</text>
    <text x="310" y="172" font-size="11" fill="#333">password</text>
    <text x="310" y="190" font-size="11" fill="#333">first_name, last_name</text>
    <text x="310" y="208" font-size="11" fill="#333">phone</text>
    <text x="310" y="226" font-size="11" fill="#333">address, city, province</text>
    <text x="310" y="244" font-size="11" fill="#333">zip_code</text>
    <text x="310" y="262" font-size="11" fill="#333">profile_image</text>
    <text x="310" y="280" font-size="11" fill="#333">status {active|suspended|banned}</text>
    <text x="310" y="298" font-size="11" fill="#333">created_at, updated_at</text>

    <!-- Specialization circle (d) -->
    <circle cx="400" cy="370" r="18" fill="white" stroke="#333" stroke-width="2"/>
    <text x="400" y="375" text-anchor="middle" font-size="11" font-weight="bold">d</text>

    <!-- Subtypes -->
    <rect x="260" y="420" width="100" height="30" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="310" y="440" text-anchor="middle" font-size="11" font-weight="bold">Buyer</text>

    <rect x="380" y="420" width="100" height="30" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="430" y="440" text-anchor="middle" font-size="11" font-weight="bold">Seller</text>

    <rect x="500" y="420" width="100" height="30" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="550" y="440" text-anchor="middle" font-size="11" font-weight="bold">Admin</text>

    <!-- Specialization lines -->
    <line x1="400" y1="330" x2="400" y2="352" stroke="#333" stroke-width="1.5"/>
    <line x1="310" y1="388" x2="310" y2="420" stroke="#333" stroke-width="1.5"/>
    <line x1="430" y1="388" x2="430" y2="420" stroke="#333" stroke-width="1.5"/>
    <line x1="550" y1="388" x2="550" y2="420" stroke="#333" stroke-width="1.5"/>
    <line x1="310" y1="388" x2="550" y2="388" stroke="#333" stroke-width="1.5"/>

    <!-- CATEGORY Entity -->
    <rect x="600" y="50" width="180" height="130" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <rect x="600" y="50" width="180" height="32" rx="4" fill="#db2777"/>
    <text x="690" y="72" text-anchor="middle" fill="white" font-weight="bold" font-size="14">CATEGORY</text>
    <text x="610" y="100" font-size="11" fill="#333"><tspan font-weight="bold" text-decoration="underline">PK id</tspan></text>
    <text x="610" y="118" font-size="11" fill="#333">FK parent_id (self-ref)</text>
    <text x="610" y="136" font-size="11" fill="#333">name</text>
    <text x="610" y="154" font-size="11" fill="#333">description</text>
    <text x="610" y="172" font-size="11" fill="#333">created_at</text>

    <!-- Self-referencing arrow for Category -->
    <path d="M 780 100 Q 820 100 820 140 Q 820 180 780 180" fill="none" stroke="#666" stroke-width="1.5"/>
    <text x="835" y="140" font-size="10" fill="#666">parent</text>
    <text x="785" y="95" font-size="10" fill="#666">0..1</text>
    <text x="785" y="190" font-size="10" fill="#666">0..*</text>

    <!-- PRODUCT Entity -->
    <rect x="580" y="240" width="200" height="260" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <rect x="580" y="240" width="200" height="32" rx="4" fill="#ca8a04"/>
    <text x="680" y="262" text-anchor="middle" fill="white" font-weight="bold" font-size="14">PRODUCT</text>
    <text x="590" y="290" font-size="11" fill="#333"><tspan font-weight="bold" text-decoration="underline">PK id</tspan></text>
    <text x="590" y="308" font-size="11" fill="#333">FK seller_id</text>
    <text x="590" y="326" font-size="11" fill="#333">FK category_id</text>
    <text x="590" y="344" font-size="11" fill="#333">title</text>
    <text x="590" y="362" font-size="11" fill="#333">description</text>
    <text x="590" y="380" font-size="11" fill="#333">price (DECIMAL)</text>
    <text x="590" y="398" font-size="11" fill="#333">condition {new|used|refurbished}</text>
    <text x="590" y="416" font-size="11" fill="#333">quantity</text>
    <text x="590" y="434" font-size="11" fill="#333">image1..image4</text>
    <text x="590" y="452" font-size="11" fill="#333">status {active|sold|pending|removed}</text>
    <text x="590" y="470" font-size="11" fill="#333">location, views</text>
    <text x="590" y="488" font-size="11" fill="#333">created_at, updated_at</text>

    <!-- ORDER Entity -->
    <rect x="860" y="240" width="200" height="210" rx="4" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <rect x="860" y="240" width="200" height="32" rx="4" fill="#4f46e5"/>
    <text x="960" y="262" text-anchor="middle" fill="white" font-weight="bold" font-size="14">ORDER</text>
    <text x="870" y="290" font-size="11" fill="#333"><tspan font-weight="bold" text-decoration="underline">PK id</tspan></text>
    <text x="870" y="308" font-size="11" fill="#333">FK buyer_id</text>
    <text x="870" y="326" font-size="11" fill="#333">FK product_id</text>
    <text x="870" y="344" font-size="11" fill="#333">FK seller_id</text>
    <text x="870" y="362" font-size="11" fill="#333">quantity</text>
    <text x="870" y="380" font-size="11" fill="#333">total_price (DECIMAL)</text>
    <text x="870" y="398" font-size="11" fill="#333">status {pending|paid|shipped|...}</text>
    <text x="870" y="416" font-size="11" fill="#333">shipping_address</text>
    <text x="870" y="434" font-size="11" fill="#333">payment_method</text>

    <!-- CART Entity -->
    <rect x="30" y="500" width="170" height="120" rx="4" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="30" y="500" width="170" height="32" rx="4" fill="#7c3aed"/>
    <text x="115" y="522" text-anchor="middle" fill="white" font-weight="bold" font-size="14">CART</text>
    <text x="40" y="550" font-size="11" fill="#333"><tspan font-weight="bold" text-decoration="underline">PK id</tspan></text>
    <text x="40" y="568" font-size="11" fill="#333">FK user_id</text>
    <text x="40" y="586" font-size="11" fill="#333">FK product_id</text>
    <text x="40" y="604" font-size="11" fill="#333">quantity</text>

    <!-- MESSAGE Entity -->
    <rect x="250" y="520" width="180" height="140" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <rect x="250" y="520" width="180" height="32" rx="4" fill="#ea580c"/>
    <text x="340" y="542" text-anchor="middle" fill="white" font-weight="bold" font-size="14">MESSAGE</text>
    <text x="260" y="570" font-size="11" fill="#333"><tspan font-weight="bold" text-decoration="underline">PK id</tspan></text>
    <text x="260" y="588" font-size="11" fill="#333">FK sender_id</text>
    <text x="260" y="606" font-size="11" fill="#333">FK receiver_id</text>
    <text x="260" y="624" font-size="11" fill="#333">FK product_id</text>
    <text x="260" y="642" font-size="11" fill="#333">message, is_read</text>

    <!-- REVIEW Entity -->
    <rect x="480" y="560" width="180" height="140" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <rect x="480" y="560" width="180" height="32" rx="4" fill="#dc2626"/>
    <text x="570" y="582" text-anchor="middle" fill="white" font-weight="bold" font-size="14">REVIEW</text>
    <text x="490" y="610" font-size="11" fill="#333"><tspan font-weight="bold" text-decoration="underline">PK id</tspan></text>
    <text x="490" y="628" font-size="11" fill="#333">FK reviewer_id</text>
    <text x="490" y="646" font-size="11" fill="#333">FK reviewed_user_id</text>
    <text x="490" y="664" font-size="11" fill="#333">FK product_id</text>
    <text x="490" y="682" font-size="11" fill="#333">rating (1-5), comment</text>

    <!-- WISHLIST Entity -->
    <rect x="720" y="560" width="170" height="100" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <rect x="720" y="560" width="170" height="32" rx="4" fill="#059669"/>
    <text x="805" y="582" text-anchor="middle" fill="white" font-weight="bold" font-size="14">WISHLIST</text>
    <text x="730" y="610" font-size="11" fill="#333"><tspan font-weight="bold" text-decoration="underline">PK id</tspan></text>
    <text x="730" y="628" font-size="11" fill="#333">FK user_id</text>
    <text x="730" y="646" font-size="11" fill="#333">FK product_id</text>

    <!-- Relationships -->
    <!-- Role -> User (1:M) -->
    <line x1="210" y1="180" x2="300" y2="180" stroke="#666" stroke-width="1.5"/>
    <text x="220" y="175" font-size="10" fill="#666">1</text>
    <text x="285" y="175" font-size="10" fill="#666">0..*</text>
    <text x="250" y="195" font-size="10" fill="#2563eb" font-style="italic">has</text>

    <!-- User -> Product (1:M) -->
    <line x1="500" y1="280" x2="580" y2="300" stroke="#666" stroke-width="1.5"/>
    <text x="510" y="275" font-size="10" fill="#666">1</text>
    <text x="565" y="295" font-size="10" fill="#666">0..*</text>
    <text x="535" y="278" font-size="10" fill="#2563eb" font-style="italic">sells</text>

    <!-- Category -> Product (1:M) -->
    <line x1="690" y1="180" x2="680" y2="240" stroke="#666" stroke-width="1.5"/>
    <text x="695" y="195" font-size="10" fill="#666">1</text>
    <text x="675" y="235" font-size="10" fill="#666">0..*</text>
    <text x="700" y="215" font-size="10" fill="#2563eb" font-style="italic">contains</text>

    <!-- Product -> Order (1:M) -->
    <line x1="780" y1="360" x2="860" y2="340" stroke="#666" stroke-width="1.5"/>
    <text x="790" y="355" font-size="10" fill="#666">1</text>
    <text x="845" y="335" font-size="10" fill="#666">0..*</text>

    <!-- User -> Order (buyer 1:M) -->
    <line x1="500" y1="200" x2="960" y2="240" stroke="#666" stroke-width="1" stroke-dasharray="4"/>
    <text x="700" y="210" font-size="10" fill="#2563eb" font-style="italic">places (buyer)</text>

    <!-- User -> Cart -->
    <line x1="310" y1="330" x2="115" y2="500" stroke="#666" stroke-width="1.5"/>
    <text x="195" y="400" font-size="10" fill="#2563eb" font-style="italic">has cart</text>

    <!-- User -> Message -->
    <line x1="350" y1="330" x2="340" y2="520" stroke="#666" stroke-width="1.5"/>
    <text x="355" y="460" font-size="10" fill="#2563eb" font-style="italic">sends/receives</text>

    <!-- User -> Review -->
    <line x1="430" y1="330" x2="530" y2="560" stroke="#666" stroke-width="1.5"/>
    <text x="490" y="470" font-size="10" fill="#2563eb" font-style="italic">writes/receives</text>

    <!-- Product -> Cart -->
    <line x1="580" y1="450" x2="200" y2="550" stroke="#666" stroke-width="1" stroke-dasharray="4"/>

    <!-- Product -> Review -->
    <line x1="620" y1="500" x2="570" y2="560" stroke="#666" stroke-width="1" stroke-dasharray="4"/>

    <!-- Legend -->
    <rect x="30" y="760" width="500" height="120" rx="8" fill="white" stroke="#ddd" stroke-width="1"/>
    <text x="50" y="785" font-size="13" font-weight="bold" fill="#333">Legend:</text>
    <rect x="50" y="795" width="20" height="12" fill="#dcfce7" stroke="#16a34a"/>
    <text x="80" y="806" font-size="11" fill="#333">Supertype Entity</text>
    <rect x="200" y="795" width="20" height="12" fill="#fef3c7" stroke="#d97706"/>
    <text x="230" y="806" font-size="11" fill="#333">Subtype Entity</text>
    <line x1="50" y1="830" x2="90" y2="830" stroke="#666" stroke-width="1.5"/>
    <text x="100" y="834" font-size="11" fill="#333">Relationship (1:M)</text>
    <line x1="250" y1="830" x2="290" y2="830" stroke="#666" stroke-width="1" stroke-dasharray="4"/>
    <text x="300" y="834" font-size="11" fill="#333">Partial Participation</text>
    <circle cx="65" cy="860" r="12" fill="white" stroke="#333" stroke-width="1.5"/>
    <text x="65" y="864" text-anchor="middle" font-size="9" font-weight="bold">d</text>
    <text x="100" y="864" font-size="11" fill="#333">Disjoint Specialization (user roles overlap via RBAC)</text>
</svg>
</body>
</html>
