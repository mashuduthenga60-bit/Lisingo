<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Context Diagram - Lisingo C2C Platform</title>
    <style>
        body { background: #f8f9fa; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #2563eb; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        svg { display: block; margin: 0 auto; background: white; border: 1px solid #ddd; border-radius: 8px; }
    </style>
</head>
<body>
<h1>Context Diagram</h1>
<p class="subtitle">Lisingo C2C E-Commerce Platform - Level 0</p>

<svg width="900" height="700" viewBox="0 0 900 700">
    <defs>
        <marker id="arrowR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
        </marker>
        <marker id="arrowL" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
            <polygon points="10 0, 0 3.5, 10 7" fill="#dc2626"/>
        </marker>
    </defs>

    <!-- Central System -->
    <circle cx="450" cy="350" r="120" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="450" y="335" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">Lisingo</text>
    <text x="450" y="355" text-anchor="middle" font-size="13" fill="#1e40af">C2C E-Commerce</text>
    <text x="450" y="375" text-anchor="middle" font-size="13" fill="#1e40af">Platform</text>

    <!-- Buyer (External Entity) -->
    <rect x="50" y="80" width="160" height="60" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="130" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">Buyer</text>

    <!-- Seller (External Entity) -->
    <rect x="50" y="420" width="160" height="60" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="130" y="455" text-anchor="middle" font-size="14" font-weight="bold" fill="#854d0e">Seller</text>

    <!-- Admin (External Entity) -->
    <rect x="680" y="80" width="160" height="60" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="760" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d174d">Administrator</text>

    <!-- Payment System (External Entity) -->
    <rect x="680" y="420" width="160" height="60" rx="4" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="760" y="455" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730a3">Payment System</text>

    <!-- Email Service (External Entity) -->
    <rect x="350" y="580" width="200" height="60" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="450" y="615" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">Email/Notification</text>

    <!-- Data Flows - Buyer to System -->
    <line x1="210" y1="95" x2="345" y2="285" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowR)"/>
    <text x="230" y="170" font-size="10" fill="#2563eb" transform="rotate(-35, 230, 170)">Registration, Search,</text>
    <text x="240" y="185" font-size="10" fill="#2563eb" transform="rotate(-35, 240, 185)">Orders, Messages</text>

    <!-- System to Buyer -->
    <line x1="340" y1="300" x2="200" y2="130" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowL)"/>
    <text x="220" y="240" font-size="10" fill="#dc2626" transform="rotate(-35, 220, 240)">Product Listings,</text>
    <text x="230" y="255" font-size="10" fill="#dc2626" transform="rotate(-35, 230, 255)">Order Confirmations</text>

    <!-- Seller to System -->
    <line x1="210" y1="435" x2="345" y2="395" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowR)"/>
    <text x="225" y="395" font-size="10" fill="#2563eb">Product Listings, Pricing,</text>
    <text x="225" y="410" font-size="10" fill="#2563eb">Images, Shipping Updates</text>

    <!-- System to Seller -->
    <line x1="340" y1="410" x2="200" y2="460" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowL)"/>
    <text x="215" y="460" font-size="10" fill="#dc2626">Order Notifications,</text>
    <text x="215" y="475" font-size="10" fill="#dc2626">Buyer Messages, Sales Reports</text>

    <!-- Admin to System -->
    <line x1="680" y1="100" x2="560" y2="290" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowR)"/>
    <text x="620" y="170" font-size="10" fill="#2563eb" transform="rotate(35, 620, 170)">User Management,</text>
    <text x="610" y="185" font-size="10" fill="#2563eb" transform="rotate(35, 610, 185)">Content Moderation, RBAC</text>

    <!-- System to Admin -->
    <line x1="565" y1="305" x2="690" y2="130" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowL)"/>
    <text x="640" y="240" font-size="10" fill="#dc2626" transform="rotate(35, 640, 240)">Reports, Analytics,</text>
    <text x="635" y="255" font-size="10" fill="#dc2626" transform="rotate(35, 635, 255)">User/Order Data</text>

    <!-- Payment System to System -->
    <line x1="680" y1="445" x2="560" y2="400" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowR)"/>
    <text x="590" y="435" font-size="10" fill="#2563eb">Payment Confirmation</text>

    <!-- System to Payment -->
    <line x1="565" y1="415" x2="690" y2="460" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowL)"/>
    <text x="590" y="460" font-size="10" fill="#dc2626">Payment Requests</text>

    <!-- System to Email -->
    <line x1="450" y1="470" x2="450" y2="580" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowL)"/>
    <text x="460" y="530" font-size="10" fill="#dc2626">Registration Confirmation,</text>
    <text x="460" y="545" font-size="10" fill="#dc2626">Order Updates, Alerts</text>

    <!-- Legend -->
    <rect x="30" y="620" width="250" height="60" rx="6" fill="white" stroke="#ddd"/>
    <text x="50" y="642" font-size="11" font-weight="bold">Legend:</text>
    <line x1="50" y1="658" x2="90" y2="658" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowR)"/>
    <text x="100" y="662" font-size="10">Data Flow (Input)</text>
    <line x1="160" y1="658" x2="200" y2="658" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowL)"/>
    <text x="210" y="662" font-size="10">Data Flow (Output)</text>
</svg>
</body>
</html>
